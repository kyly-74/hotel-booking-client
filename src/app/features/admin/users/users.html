<h2>Quản lý người dùng</h2>

<table *ngIf="users.length > 0">
  <thead>
    <tr>
      <th>ID</th>
      <th>Họ tên</th>
      <th>Email</th>
      <th>Vai trò</th>
      <th>Trạng thái</th>
      <th>Bookings</th>
      <th>Reviews</th>
      <th>Hotels</th>
      <th>Action</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let user of users">
      <td>{{ user.id }}</td>
      <td>{{ user.fullName }}</td>
      <td>{{ user.email }}</td>
      <td>{{ user.role }}</td>

      <td>
        {{ user.isLocked ? 'Locked' : 'Active' }}
      </td>

      <td>{{ user.totalBookings }}</td>
      <td>{{ user.totalReviews }}</td>
      <td>{{ user.totalManagedHotels }}</td>

      <td>
        <button (click)="toggleLock(user)">
            {{ user.isLocked ? 'Mở khóa' : 'Khóa' }}
        </button>
      </td>
    </tr>
  </tbody>
</table>

<section class="hero">
  <div class="hero-overlay">
    <div class="hero-content">
      <h1>Đặt phòng khách sạn dễ dàng</h1>
      <p>Tìm kiếm hàng trăm khách sạn với giá tốt nhất</p>
      <form class="search-box" (ngSubmit)="search()">
        <input type="text" placeholder="Bạn muốn đi đâu?" [(ngModel)]="destination" name="destination">
        <input type="date" [(ngModel)]="checkIn" name="checkIn">
        <input type="date" [(ngModel)]="checkOut" name="checkOut">
        <select [(ngModel)]="guests" name="guests">
          <option value="1">1 khách</option>
          <option value="2">2 khách</option>
        </select>
        <button type="submit">Tìm kiếm</button>
      </form>
    </div>
  </div>
</section>

<div class="home-container" *ngIf="homeData; else loading">
  
  <section class="section">
    <h2>Điểm đến nổi bật</h2>
    <div class="city-grid">
      <div *ngFor="let city of homeData.popularCities" class="city-card">
        {{ city }}
      </div>
    </div>
  </section>

  <section class="section">
    <h2>Khách sạn nổi bật</h2>
    <div class="hotel-grid">
      <div *ngFor="let hotel of homeData.featuredHotels" class="hotel-card">
        <img [src]="hotel.imageUrl || 'assets/no-image.jpg'" [alt]="hotel.name">
        <div class="hotel-body">
          <h3>{{ hotel.name }}</h3>
          <p>{{ hotel.city }}</p>
          <span>{{ hotel.starRating }} sao</span>
          <button class="btn-view">Xem chi tiết</button>
        </div>
      </div>
    </div>
  </section>

  <section class="section">
    <h2>🔥 Phòng Hot</h2>
    <div class="room-grid">
      <div *ngFor="let room of homeData.hotRooms" class="room-card">
        <img [src]="room.image || 'assets/no-image.jpg'" [alt]="room.roomName">
        <div class="room-body">
          <h3>{{ room.roomName }}</h3>
          <p>{{ room.hotelName }}</p>
          <span>{{ room.price | number }} đ</span>
          <button class="btn-book">Xem & Đặt phòng</button>
        </div>
      </div>
    </div>
  </section>

</div>

<ng-template #loading>
  <div class="loading">Đang tải dữ liệu...</div>
</ng-template>

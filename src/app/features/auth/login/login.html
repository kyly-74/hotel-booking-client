<div class="auth-container">
  <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="auth-form">
    <h2>ĐĂNG NHẬP</h2>

    <div class="form-group">
      <label>Email</label>
      <input type="email" formControlName="email" class="form-control" [ngClass]="{ 'is-invalid': isSubmitted && f['email'].errors }">
      <div *ngIf="isSubmitted && f['email'].errors" class="error-text">
        <span *ngIf="f['email'].errors['required']">Email không được bỏ trống.</span>
      </div>
    </div>

    <div class="form-group">
      <label>Mật khẩu</label>
      <input type="password" formControlName="password" class="form-control" [ngClass]="{ 'is-invalid': isSubmitted && f['password'].errors }">
      <div *ngIf="isSubmitted && f['password'].errors" class="error-text">
        <span *ngIf="f['password'].errors['required']">Mật khẩu không được bỏ trống.</span>
      </div>
    </div>

    <button type="submit" class="btn-submit">Đăng Nhập</button>

    <div class="divider"><span>HOẶC</span></div>

    <div id="googleBtn"></div>

      <div class="auth-footer">
    Bạn chưa có tài khoản? <a routerLink="/auth/register">Đăng ký ngay</a>
  </div>
  </form>

</div>

<div style="padding: 50px; text-align: center;">
  <h2>TRANG TEST THANH TOÁN KHÁCH SẠN</h2>
  <p>Mã đặt phòng hiện tại: <strong>{{ bookingId }}</strong></p>
  <p>Số tiền cần trả: <strong>{{ totalAmount | currency:'VND':'symbol':'1.0-0' }}</strong></p>
  
  <br><br>
  
  <button (click)="pay()" [disabled]="loading" style="padding: 15px 30px; font-size: 16px; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 5px;">
    {{ loading ? 'Đang kết nối VnPay...' : 'BẤM VÀO ĐÂY ĐỂ THANH TOÁN THỬ' }}
  </button>
</div>
